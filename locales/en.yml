app:
  about: "Bun-like JS runtime on SpiderMonkey"
arg:
  verbose:
    help: "Increase log verbosity (-v: info, -vv: debug, -vvv: trace)"
  lang:
    help: "Language for help text (en/zh; defaults to the system language)"
    value: "LANG"
  run:
    help: "Run a JS file and print its completion value"
    value: "FILE"
  eval:
    help: "Evaluate inline JS code"
    value: "CODE"
  config:
    help: "Show resolved settings (or their JSON Schema with --schema)"
  completions:
    help: "Print a shell completion script for the given shell"
    value: "SHELL"
  man:
    help: "Print roff manual pages to stdout"
  add:
    help: "Add packages to the current project (local node_modules)"
    value: "PKG"
  install:
    help: "Install packages globally (shared data directory)"
    value: "PKG"
  publish:
    help: "Publish the current package (dry-run validates only)"
  login:
    help: "Log in to a registry (stores a token in ~/.npmrc)"
  upgrade:
    help: "Self-upgrade winterjs (needs WINTERJS_UPDATE_GITHUB=owner/repo)"
  init:
    help: "Scaffold a new package"
    value: "NAME"
  repl:
    help: "Start an interactive REPL"
  test:
    help: "Run test files"
    value: "PATH"
  lint:
    help: "Forward to the project's oxlint (passthrough; args go to oxlint verbatim)"
    value: "ARGS"
  fmt:
    help: "Forward to the project's oxfmt (passthrough; args go to oxfmt verbatim)"
    value: "ARGS"
  serve:
    help: "Serve a directory over HTTP"
    value: "DIR"
  args:
    help: "Script arguments for --run (as `process.argv.slice(2)`)"
    value: "ARGS"
  dry_run:
    help: "Only resolve and print the tree, do not write anything (add/install/upgrade)"
  registry:
    help: "Registry base URL (default https://registry.npmjs.org)"
    value: "REGISTRY"
  tag:
    help: "Dist-tag to publish under"
    value: "TAG"
  token:
    help: "Auth token to store (prompted on TTY when omitted)"
    value: "TOKEN"
  oauth:
    help: "Print an OAuth authorization URL instead (code exchange deferred)"
  name:
    help: "Package name for --init (default: current directory name)"
    value: "NAME"
  yes:
    help: "Skip the confirmation prompt"
  force:
    help: "Overwrite conflicting files instead of failing"
  filter:
    help: "Only run files matching this glob (matched against relative path or file name)"
    value: "FILTER"
  test_name_pattern:
    help: "Only run tests whose full name matches (substring or /regex/flags)"
    value: "PATTERN"
  watch:
    help: "Re-run tests when watched files change (Ctrl-C to stop)"
  dir:
    help: "Directory to serve"
    value: "DIR"
  host:
    help: "Interface to bind"
    value: "HOST"
  port:
    help: "Port to bind (0 = ephemeral, actual port printed on stdout)"
    value: "PORT"
  limit_rps:
    help: "Requests per second limit, 0 = unlimited"
    value: "LIMIT_RPS"
  cert:
    help: "TLS certificate (PEM, must come with --key)"
    value: "CERT"
  key:
    help: "TLS private key (PEM, must come with --cert)"
    value: "KEY"
  acme_domain:
    help: "ACME domain for automatic certificates (default winterjs.bemly.moe; needs --acme-email)"
    value: "DOMAIN"
  acme_email:
    help: "ACME account email (mailto contact for Let's Encrypt)"
    value: "EMAIL"
  acme_cache:
    help: "ACME cache directory (default system cache)"
    value: "DIR"
  acme_production:
    help: "Use Let's Encrypt production (default staging, safe against rate limits)"
  schema:
    help: "Print the JSON Schema of the settings file instead"
  allow_read:
    help: "Allow filesystem reads (optionally: --allow-read=<path>[,<path>...])"
    value: "PATH"
  allow_write:
    help: "Allow filesystem writes (optionally: --allow-write=<path>[,<path>...])"
    value: "PATH"
  allow_env:
    help: "Allow environment variable access (optionally: --allow-env=<VAR>[,<VAR>...])"
    value: "VAR"
  allow_run:
    help: "Allow spawning child processes (optionally: --allow-run=<cmd>[,<cmd>...])"
    value: "CMD"
  allow_ffi:
    help: "Allow FFI (dlopen of native libraries)"
  allow_all:
    help: "Allow everything (no sandbox)"
