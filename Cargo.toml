[package]
name = "winterjs"
version = "26.9.13"   # CalVer YY.MM.PATCH，见 AGENTS.md §1
edition = "2024"
description = "A Bun-like JS runtime on Mozilla SpiderMonkey (via servo/mozjs)"
license = "MPL-2.0"

# rustc 的 check-cfg 尚不认识 ohos（src/alloc.rs 移动端门控用）与 tokio_unstable
#（tokio-console 实验埋点门控，经 RUSTFLAGS 传入）：此处声明为预期值，
# unexpected_cfgs 继续对拼写错误生效。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("ohos"))', 'cfg(tokio_unstable)'] }

# 依赖来源：docs/dependencies.md（已批准采购单，2026-09-10 起全量引入）。
# §2 特性门控为红线：配错 feature 会把 ✅ 变成 ⚠️/❌（native-tls/openssl、
# aws-lc、bzip2(zip 0.5 默认 C)、zstd(C) 一律禁；config 的 yaml 经纯度审计已启用）。
# 代码按 Phase 接线使用。

# 本仓 cargo features（2026-09-11）：
# - `tokio-console`：按需启用 tokio-console 观测（`dep:console-subscriber` + `tokio/tracing`）。
#   默认关闭零成本；启用必须 `RUSTFLAGS="--cfg tokio_unstable" cargo build --features tokio-console`
#  （tokio 的实验埋点门控在该 cfg，不在 cargo feature 内；缺之编译期直接报错，
#   见 docs/dependencies.md §10；实测上游 console 在运行时 assert 同一条）。
# - `cap-std`：按需启用能力化 fs 底座（`dep:cap-std`，权限模型后续可用）。
#   默认关闭零成本；当前 `--allow-*` 走边界校验（`src/permissions.rs`），不依赖它，
#   留作后期 Dir 化重构时启用（见 docs/dependencies.md §8）。
# - `quinn`：QUIC 传输（node:quic 底座，2026-09-12 拍板，2026-09-13 接线并默认启用）。
#   quinn 自身开 default 特性（log/platform-verifier/runtime-tokio/rustls-ring/bloom，
#   全纯 Rust + ring 豁免，aws-lc 全系 opt-in 未开，见 docs/dependencies2.md §quic）。
[features]
default = ["quinn"]
tokio-console = ["dep:console-subscriber", "tokio/tracing"]
cap-std = ["dep:cap-std"]
quinn = ["dep:quinn", "dep:h3", "dep:h3-quinn"]

[dependencies]
# 铁律：mozjs 永远钉死精确版本，只跟随 servo 的 release 手动升级，
# 绝不 cargo update -p mozjs（会浮到 servo main HEAD 当场炸）。
mozjs = "=0.26.0"

# ── §3 Phase 0 底座：错误/日志/异步/序列化/内存/并发原语 ────────────────
anyhow = "1"
thiserror = "2"
derive_more = { version = "2", features = ["full"] }
strum = { version = "0.28", features = ["derive"] }
derive_builder = "0.20"
bitflags = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-error = "0.2"
miette = { version = "7", features = ["fancy"] }
human-panic = "2"
talc = "5"                                   # 移动端（android/ohos）回退分配器
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-util", "net", "fs", "process", "signal"] }
futures = "0.3"
tokio-util = "0.7"
async-stream = "0.3"
pin-project-lite = "0.2"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
rayon = "1"
parking_lot = "0.12"
dashmap = "6"
lru = "0.18"
indexmap = "2"
rustc-hash = "2"
smallvec = "1"
smol_str = "0.3"
camino = "1"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = "0.18"
config = { version = "0.15", default-features = false, features = ["toml", "json", "ini", "yaml"] }  # yaml 实测纯 Rust（yaml-rust2 链，2026-09-10 审计启用）；Environment 源内建无需特性
yaml-rust2 = "0.12"
schemars = "1"
blake3 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
const-hex = "1"
zerocopy = { version = "0.8", features = ["derive"] }
binrw = "0.15"
postcard = { version = "1", features = ["use-std"] }
serde_bytes = "0.11"
serde_path_to_error = "0.1"
dyn-clone = "1"
ouroboros = "0.18"
slotmap = "1"
arc-swap = "1"
itertools = "0.15"
memmap2 = "0.9"

# ── §4 CLI / 终端 / 自升级 ─────────────────────────────────────────────
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
console = "0.16"
indicatif = "0.18"
dialoguer = "0.12"
rustyline = "18"
shlex = "2"
shellexpand = "3"
unicode-width = "0.2"
humantime = "2"
bytesize = "2"
askama = "0.16"
# §2：zip 用 deflate 禁 bzip2（C）；不开 "rustls" 特性（它映射 reqwest 0.13 的 aws-lc），
# TLS 由全图统一的 reqwest/rustls-no-provider + 顶层 rustls/ring provider 提供；
# "github" 为纯开关（无新增传递依赖，5d-d4 自升级用）
self_update = { version = "1", default-features = false, features = ["reqwest", "archive-zip", "compression-zip-deflate", "github"] }
# CLI 中英文双语：locales/*.yml 编译期打进二进制；YAML 解析只在 build/proc-macro（host 侧），
# binary 新增仅 arc-swap（已在树内）/base62/siphasher/triomphe/smallvec（已在树内），全纯 Rust（见 §4 备注）
rust-i18n = "4"

# ── §5 loader + 转译 + 编译期注册 + 内嵌资源 ───────────────────────────
oxc_resolver = "11"
oxc = { version = "0.149", default-features = false, features = ["semantic", "codegen", "transformer", "mangler", "minifier"] }
jsonc-parser = "0.33"
sourcemap = "9"
linkme = "0.3"
paste = "1"
phf = { version = "0.14", features = ["macros"] }
petgraph = "0.8"
string-interner = "0.20"
toml_edit = "0.25"
target-lexicon = "0.13"
include_dir = "0.7"

# ── §6 Web API：fetch / 编码 / WebSocket / 重试 / Cookie / TLS ─────────
# §2：default-features=false，rustls-no-provider（provider 由顶层 rustls/ring 提供，reqwest 0.13 的
# "rustls" 特性硬绑 aws-lc 禁用）；不开 zstd（C），压缩走 gzip/br/deflate
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "json", "stream", "gzip", "brotli", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-platform-verifier = "0.7"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
hickory-resolver = "0.26"
backon = "1"
url = "2"
data-url = "0.3"
urlpattern = "0.6"  # Deno 官方 URLPattern 实现（2026-09-11 引入，代替手写状态机；icu 可统一无死锁，见 §6 备注）
base64 = "0.23"
percent-encoding = "2"
form_urlencoded = "1"
serde_urlencoded = "0.7"
encoding_rs = "0.8"
cookie_store = { version = "0.22", features = ["public_suffix"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
async-compression = { version = "0.4", default-features = false, features = ["gzip", "brotli", "deflate"] }
flate2 = "1"        # 默认后端 miniz_oxide（纯 Rust），禁 zlib/zlib-ng
brotli = "9"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }   # 禁 hash：content_checksum 会给每帧补 4 字节（空帧 13B），与 Node/libzstd 默认无校验（9B）对不上
ipnet = "2"
regex = "1"
memchr = "2"

# ── §7 加密全家（WebCrypto + node:crypto）──────────────────────────────
sha1 = "0.11"
sha2 = "0.11"
# c-4（2026-09-10 用户拍板）：rsa 0.9 的签名/填充接口绑 digest 0.10，
# 直引 sha2 0.11 的哈希类型传不进去；加改名直引 sha2_010（纯 RustCrypto，
# 0.10 已由 oauth2 在传递闭包内，双版本先例同 yaml-rust2 0.11+0.12）。
# oid 特性必开：rsa 的 SigningKey::new 要 D: AssociatedOid（DigestInfo 前缀），
# sha2 0.10 的 OidSha* 实现门控在该特性后（缺之即 E0599）。
sha2_010 = { package = "sha2", version = "0.10", features = ["oid"] }
sha3 = "0.12"
blake2 = "0.11"
md-5 = "0.11"
# 9h-2（用户拍板两项全要）：ripemd160（RustCrypto digest 0.11 直通）+
# SHAKE（sha3 0.12 已无类型，tiny-keccak shake 特性；CC0，见 dependencies2 9h-2）。
ripemd = "0.2"
tiny-keccak = { version = "2", default-features = false, features = ["shake"] }
hmac = "0.13"
hkdf = "0.13"
pbkdf2 = "0.13"
scrypt = "0.12"
argon2 = "0.6"
aes = "0.9"
cbc = "0.2"
ctr = "0.10"
des = "0.9"
blowfish = "0.10"
aes-gcm = "0.11"
# 10e（2026-09-15 用户拍板）：AES-CCM 三档（aes-128/192/256-ccm）；
# deps（aead 0.6/cipher 0.5/ctr 0.10）与树内零版本墙，见 dependencies3.md §1。
ccm = "0.6"
# 10e（2026-09-15 用户拍板）：GCM 任意 iv 的 J0 构造（NIST SP 800-38D）；
# 闭包内已有精确 0.6.0（aes-gcm 0.11 带入），直引零新增传递依赖。
ghash = "0.6"
chacha20poly1305 = "0.11"
# 10e（2026-09-15 用户特批）：Ed448 签名；稳定版停在 0.9.0（rand_core 0.6
# 不兼容本仓栈），钉预发布 =0.14.0-pre.15，上游发稳定版后回 caret。
ed448-goldilocks = "=0.14.0-pre.15"
ed25519-dalek = "3"
x25519-dalek = { version = "3", features = ["static_secrets"] }  # c-4x：按值 secret（from>+diffie_hellman），纯 Rust 特性门
# 10f（2026-09-18 用户拍板）：X448 DH（RFC 7748）；与 ed448-goldilocks 同列车
# 预发布线，钉 =0.14.0-pre.12（依赖恰命中树内 ed448-goldilocks 0.14.0-pre.15），
# 上游发稳定版后随 ed448 一并回 caret。
x448 = { version = "=0.14.0-pre.12", features = ["static_secrets"] }
# c-4（2026-09-10 用户拍板）：ecdh/pkcs8 显式声明。之前靠 russh→ssh-key 的
# 传递特性 unify 硬撑（能编过但上游一变就断），此处写明防变卦；全员纯 Rust。
p256 = { version = "0.14", features = ["ecdh", "pkcs8"] }
p384 = { version = "0.14", features = ["ecdh", "pkcs8"] }
p521 = { version = "0.14", features = ["ecdh", "pkcs8"] }
# 9h-1：secp256k1（node:crypto ECDH/签名；ecdh 纯 Rust，见 dependencies2 注记）。
k256 = { version = "0.14", features = ["ecdh"] }
crypto-bigint = "0.7"
# 9i（2026-09-13 用户拍板）：ml-kem（RustCrypto/KEMs FIPS 203，
# kem 0.3 traits，不碰 digest 版本墙；ML-DSA 另议）。
ml-kem = "0.3"
# 9h-1：DSA 密钥生成要 hazmat（纯 Rust，见 dependencies2 注记）。
dsa = { version = "0.7", features = ["hazmat"] }
rsa = "0.9"
der = "0.8"
pem-rfc7468 = "1"
pkcs8 = "0.11"
spki = "0.8"
x509-cert = "0.3"
rcgen = "0.14"       # 默认即 ring，禁 aws-lc/fips 特性
secrecy = "0.10"
getrandom = "0.4"
rand = "0.10"
uuid = { version = "1", features = ["v4"] }

# ── §8 fs / os / 包管理工具链 ──────────────────────────────────────────
dunce = "1"
pathdiff = "0.2"
normpath = "1"
cap-std = { version = "4", optional = true }  # feature `cap-std` 按需启用，默认零成本（见顶部 [features]）
which = "8"
walkdir = "2"
glob = "0.3"
ignore = "0.4"
notify = "8.2"       # §8 钉 8 系（9 在 rc）
notify-debouncer-mini = "0.7"
dirs = "7"
sysinfo = "0.39"
if-addrs = "0.15"
mac_address = "1"
uzers = "0.12"
sys-locale = "0.3"
fs-err = "3"
remove_dir_all = "1"
jiff = "0.2"
semver = "1"
deno_semver = "0.10"
spdx = "0.13"
rust-ini = "0.21"
gix = "0.87"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }    # §2 禁 bzip2
reflink-copy = "0.1"
ssri = "9"
fs4 = "1"
filetime = "0.2"
libloading = "0.9"
webbrowser = "1"
oauth2 = { version = "5", default-features = false, features = ["rustls-tls"] }
# sentry：§2 禁 "transport" 捆绑特性（拖 native-tls）；但 ReqwestHttpTransport 本体
# 只门控在 "reqwest" 特性（实测 sentry 0.49 transports/mod.rs），配 rustls-no-provider
# + 全图 ring provider 直接可用，无需自实现 transport；默认关闭零成本（§8）
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls-no-provider"] }

# ── §9 内建 DB：turso ──────────────────────────────────────────────────
# §2：default-features=false + pure-rust-crypto（禁 mimalloc，远程 sync 先不开——0.6 的 sync 特性
# 还硬绑 hyper-tls/native-tls）。
# 2026-09-10 用户拍板：钉 =0.6.1。0.7 全线非可选依赖 icu_locale ^2.2.0，与 mozjs_sys 钉死的
# icu_capi =2.1.2 死锁（见 docs/dependencies.md §9/§16）；0.6.1 无 icu。此处偏离 caret 政策
# 属刻意钉版（icu 地雷系列），待上游解冲突后回 caret。
turso = { version = "=0.6.1", default-features = false, features = ["pure-rust-crypto"] }

# ── §10 serve（HTTP 服务）──────────────────────────────────────────────
axum = "0.8"
axum-extra = "0.12"
# §h2（2026-09-12 用户拍板，node:http2 必选）：直引 hyper，只开 server+http2
# （禁 client/ffi/capi；client 侧同特性服务，无需另加）；版本跟 lock（1.11.1）。
hyper = { version = "1", default-features = false, features = ["server", "http2"] }
tower = "0.5"
# §2：只开 fs/cors/compression-gzip,br/trace，禁 compression-zstd
tower-http = { version = "0.7", default-features = false, features = ["fs", "cors", "compression-gzip", "compression-br", "trace"] }
headers = "0.4"
mime_guess = "2"
cookie = "0.18"
httpdate = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
# §quic（2026-09-12 用户拍板必选，2026-09-13 接线）：quinn 直引，自身 default 特性
# 全开（log/platform-verifier/runtime-tokio/rustls-ring/bloom；aws-lc 系 opt-in 未碰，
# 纯度见 dependencies2.md §quic）；optional 经 feature 门控，默认启用（default 含 quinn）。
quinn = { version = "0.11", optional = true }
# 9i（2026-09-13 用户拍板，quic 特性组）：h3 + h3-quinn（hyperium/h3 experimental；
# quinn ^0.11.7 正配本仓 0.11.11；headers 面走 H3 分支，裸流分支不动）。
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
governor = "0.10"
metrics = "0.24"
# push-gateway 特性硬绑 hyper-rustls/aws-lc-rs（§2 禁），只开 http-listener（/metrics 自托管）
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
console-subscriber = { version = "0.5", optional = true }
local-ip-address = "0.6"
# default 硬绑 aws-lc-rs（§2 禁）；hyper-rustls 特性同样拖 aws-lc，先只进 ring 类型层，
# ACME HTTP 客户端到 Phase 6 随 tokio-rustls/ring 一起接线
instant-acme = { version = "0.8", default-features = false, features = ["ring"] }
qrcode = "0.14"
wide = "1"
ml-dsa = "0.1.1"

# ── 平台专用行（§8 矩阵 ❌ 的按 cfg 门控）───────────────────────────────
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal", "fs", "ioctl", "term"] }  # 10c（2026-09-15 用户拍板）：tty winsize（TIOCGWINSZ）；空依赖列表，零新 crate；term：setRawMode 真标志（同 crate 开特性，零新 crate）
# 10c（2026-09-15 用户拍板）：TIOCGWINSZ ioctl 的类型与常量（纯 FFI，无代码；unix-only 用）
# 版本走 0.2（与锁内 0.2.189 同线，零新增传递依赖）
libc = "0.2"



[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
junction = "2"

# 桌面主分配器（smmalloc 无 android/ohos 支持代码，见 §3 备注/§16）
[target.'cfg(not(any(target_os = "android", target_os = "ohos")))'.dependencies]
smmalloc = "7"

# ── §11 dev 依赖（只跑在 host）─────────────────────────────────────────
[dev-dependencies]
similar = "3"
insta = "1"
assert_cmd = "2"
assert_fs = "1"
tempfile = "3"
serial_test = "4"
rstest = "0.27"
pretty_assertions = "1"
criterion = "0.8"
iai-callgrind = "0.16"
dhat = "0.3"
proptest = "1"

[build-dependencies]
# §2：vergen 10 起 git 支持拆到独立 crate vergen-gitcl（调 git CLI，禁 git2 的 C）
vergen-gitcl = { version = "10", features = ["build"] }
# napi（plan-napi M0）：vendored Node 头 → sys 类型生成（函数声明 blocklist，
# 由 src/napi 定义并导出）；host-only build-dep，build 期需 libclang（mozjs_sys 同要求）
bindgen = { version = "0.73", default-features = false, features = ["runtime"] }

# criterion 自带 main，关 libtest harness（否则 bench 二进制空跑 0 tests）
[[bench]]
name = "loader"
harness = false
