<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
  <style>
    .w { fill: #16233a; }
    .js { fill: #2f9be8; }
    .cur { fill: #2f9be8; }
    .flake { fill: #2f9be8; }
    @media (prefers-color-scheme: dark) {
      .w { fill: #f2f5f9; }
    }
  </style>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cfeaff" stop-opacity="0.85"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1.6 0; 1.6 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <!-- twinkling snowflake -->
  <text class="flake" x="28" y="118" font-size="44" opacity="0.9">❄
    <animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.6s" repeatCount="indefinite"/>
  </text>
  <!-- base wordmark -->
  <text x="84" y="122" font-size="96" font-weight="900" letter-spacing="2"><tspan class="w">Winter</tspan><tspan class="js">JS</tspan></text>
  <!-- shine sweep overlay -->
  <text x="84" y="122" font-size="96" font-weight="900" letter-spacing="2" fill="url(#shine)">WinterJS</text>
  <!-- blinking block cursor -->
  <text class="cur" x="584" y="122" font-size="88" font-weight="900">▊
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </text>
</svg>
