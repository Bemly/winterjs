# Deploy sample/docs (static luolita site, no build step) to GitHub Pages.
# Custom domain winterjs.bemly.moe is pinned by sample/docs/CNAME.
# Enable once in repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy docs to GitHub Pages

on:
  # Runs on pushes to master that touch the docs or this workflow
  push:
    branches: ["master"]
    paths:
      - "sample/docs/**"
      - ".github/workflows/pages.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate luoli coffee segments
        run: |
          npm install --no-save coffeescript@2 >/dev/null 2>&1
          node scripts/check-luoli.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: sample/docs

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
