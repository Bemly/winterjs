<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | winterjs docs</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ site.baseurl }}/">winterjs docs</a>
    <nav class="lang">
      {% if page.lang == 'zh' %}
      <a href="{{ site.baseurl }}/en/{{ page.stub }}/">EN</a> | <strong>中文</strong>
      {% else %}
      <strong>EN</strong> | <a href="{{ site.baseurl }}/zh/{{ page.stub }}/">中文</a>
      {% endif %}
    </nav>
  </header>
  <div class="shell">
    <aside class="sidebar">
      {% if page.lang == 'zh' %}
      <a href="{{ site.baseurl }}/zh/quickstart/">快速上手</a>
      <a href="{{ site.baseurl }}/zh/api/">API 参考</a>
      <a href="{{ site.baseurl }}/zh/cli/">CLI 参考</a>
      {% else %}
      <a href="{{ site.baseurl }}/en/quickstart/">Quickstart</a>
      <a href="{{ site.baseurl }}/en/api/">API reference</a>
      <a href="{{ site.baseurl }}/en/cli/">CLI reference</a>
      {% endif %}
      <a class="repo" href="https://github.com/Bemly/winterjs">GitHub ↗</a>
    </aside>
    <main class="content">
      {{ content }}
    </main>
  </div>
  <footer class="footer">
    winterjs docs · built from <code>sample/docs</code> on every push to master
  </footer>
</body>
</html>
