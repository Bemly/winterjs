app:
  about: "Bun-like JS runtime on SpiderMonkey"
  banner_help: |
      -hide_banner    Hide the startup banner, like ffmpeg does
      -ascii_banner   Force the ASCII banner even on graphics-capable terminals
arg:
  verbose:
    help: "Increase log verbosity (-v: info, -vv: debug, -vvv: trace)"
  lang:
    help: "Language for help text (en/zh; defaults to the system language)"
    value: "LANG"
  run:
    help: "Run a JS file (with a script extension) or a package.json script (bare name), and print its completion value"
    value: "FILE"
  eval:
    help: "Evaluate inline JS code and print its completion value"
    value: "CODE"
  config:
    help: "Show resolved settings (or their JSON Schema with --schema)"
  completions:
    help: "Print a shell completion script for the given shell"
    value: "SHELL"
  man:
    help: "Print roff manual pages to stdout"
  add:
    help: "Add packages to the current project (local node_modules)"
    value: "PKG"
  install:
    help: "Install packages globally (shared data directory)"
    value: "PKG"
  remove:
    help: "Remove packages from the current project (local node_modules)"
    value: "PKG"
  uninstall:
    help: "Uninstall packages installed globally (shared data directory)"
    value: "PKG"
  publish:
    help: "Publish the current package (dry-run validates only)"
  login:
    help: "Log in to a registry (stores a token in ~/.npmrc)"
  upgrade:
    help: "Self-upgrade winterjs2 (needs WINTERJS2_UPDATE_GITHUB=owner/repo)"
  init:
    help: "Scaffold a new package (installs package.json dependencies when present)"
    value: "NAME"
  repl:
    help: "Start an interactive REPL"
  test:
    help: "Run test files (no paths: discover them from the current directory)"
    value: "PATH"
  lint:
    help: "Forward to oxlint (found in node_modules/.bin or PATH; args pass through verbatim)"
    value: "ARGS"
  fmt:
    help: "Forward to oxfmt (found in node_modules/.bin or PATH; args pass through verbatim)"
    value: "ARGS"
  serve:
    help: "Serve a directory or a JS handler over HTTP (H1/H2/H3; TLS via --cert/--key or ACME)"
    value: "DIR"
  db:
    help: "Inspect a turso/SQLite database file (prints tables by default, or runs --exec SQL)"
    value: "FILE"
  args:
    help: "Script arguments for --run (as `process.argv.slice(2)`)"
    value: "ARGS"
  dry_run:
    help: "Resolve/validate only and print, do not write anything (add/install/remove/uninstall/publish/init/upgrade, --serve ACME, --db plan print)"
  registry:
    help: "Registry base URL for package actions (add/install/publish/login/init; default https://registry.npmjs.org)"
    value: "REGISTRY"
  tag:
    help: "Dist-tag to publish under (publish only)"
    value: "TAG"
  token:
    help: "Auth token to store (login only; prompted on TTY when omitted)"
    value: "TOKEN"
  oauth:
    help: "Print an OAuth authorization URL instead (login only; code exchange deferred)"
  name:
    help: "Package name for --init (default: current directory name)"
    value: "NAME"
  yes:
    help: "Skip the confirmation prompt (init only)"
  force:
    help: "Overwrite conflicting files instead of failing (init only)"
  filter:
    help: "Only run files matching this glob (test only; matched against relative path or file name)"
    value: "FILTER"
  test_name_pattern:
    help: "Only run tests whose full name matches (test only; substring or /regex/flags)"
    value: "PATTERN"
  watch:
    help: "Re-run when watched files change (test/run/serve only; Ctrl-C to stop)"
  dir:
    help: "Directory to serve (serve only)"
    value: "DIR"
  host:
    help: "Interface to bind (serve only)"
    value: "HOST"
  port:
    help: "Port to bind (serve only; 0 = ephemeral, actual port printed on stdout)"
    value: "PORT"
  handler:
    help: "JS handler file for --serve (export default { fetch } or export function fetch)"
    value: "FILE"
  limit_rps:
    help: "Requests per second limit (serve only; 0 = unlimited)"
    value: "LIMIT_RPS"
  cert:
    help: "TLS certificate (serve only; PEM, must come with --key)"
    value: "CERT"
  key:
    help: "TLS private key (serve only; PEM, must come with --cert)"
    value: "KEY"
  acme_domain:
    help: "ACME domain for automatic certificates (serve only; default winterjs.bemly.moe; needs --acme-email)"
    value: "DOMAIN"
  acme_email:
    help: "ACME account email (serve only; mailto contact for Let's Encrypt)"
    value: "EMAIL"
  acme_cache:
    help: "ACME cache directory (serve only; default system cache)"
    value: "DIR"
  acme_production:
    help: "Use Let's Encrypt production (serve only; default staging, safe against rate limits)"
  schema:
    help: "Print the JSON Schema of the settings file instead (config only)"
  exec:
    help: "SQL to run against the database (db only; default lists tables)"
    value: "SQL"
  storage_path:
    help: "Storage database file for global storage/localStorage (run/eval/test/repl/serve only; default ./winterjs2-storage.db)"
    value: "FILE"
  allow_read:
    help: "Allow filesystem reads (run/eval/test/repl/db only; optionally: --allow-read=<path>[,<path>...])"
    value: "PATH"
  allow_write:
    help: "Allow filesystem writes (run/eval/test/repl/db only; optionally: --allow-write=<path>[,<path>...])"
    value: "PATH"
  allow_env:
    help: "Allow environment variable access (run/eval/test/repl/db only; optionally: --allow-env=<VAR>[,<VAR>...])"
    value: "VAR"
  allow_run:
    help: "Allow spawning child processes (run/eval/test/repl/db only; optionally: --allow-run=<cmd>[,<cmd>...])"
    value: "CMD"
  allow_ffi:
    help: "Allow FFI (run/eval/test/repl/db only; dlopen of native libraries)"
  allow_all:
    help: "Allow everything (run/eval/test/repl/db only; no sandbox)"
  help:
    help: "Print help"
  version:
    help: "Print version"
