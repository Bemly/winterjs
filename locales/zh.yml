app:
  about: "类 Bun 的 JS 运行时（基于 SpiderMonkey）"
  banner_help: |
      -hide_banner    隐藏启动 banner（致敬 ffmpeg 同名选项）
      -ascii_banner   强制 ASCII banner，图形终端也不加载图片
arg:
  verbose:
    help: "提高日志详细程度（-v：info，-vv：debug，-vvv：trace）"
  lang:
    help: "帮助文本语言（en 英文 / zh 中文，默认跟随系统语言）"
    value: "语言"
  run:
    help: "运行 JS 文件（带脚本后缀）或 package.json 脚本（裸名），并打印其完成值"
    value: "文件"
  eval:
    help: "求值内联 JS 代码并打印其完成值"
    value: "代码"
  config:
    help: "显示解析后的配置（加 --schema 显示其 JSON Schema）"
  completions:
    help: "打印指定 shell 的补全脚本"
    value: "Shell"
  man:
    help: "打印 roff 手册页到标准输出"
  add:
    help: "给当前工程添加软件包（本地 node_modules）"
    value: "包"
  install:
    help: "全局安装软件包（共享数据目录）"
    value: "包"
  remove:
    help: "从当前工程移除软件包（本地 node_modules）"
    value: "包"
  uninstall:
    help: "卸载全局安装的软件包（共享数据目录）"
    value: "包"
  publish:
    help: "发布当前软件包（dry-run 仅校验）"
  login:
    help: "登录 registry（令牌存入 ~/.npmrc）"
  upgrade:
    help: "自升级 winterjs（需要 WINTERJS_UPDATE_GITHUB=owner/repo）"
  init:
    help: "新建软件包脚手架（已有 package.json 依赖时自动安装）"
    value: "名称"
  repl:
    help: "启动交互式 REPL"
  test:
    help: "运行测试文件（无路径时从当前目录自动发现测试文件）"
    value: "路径"
  lint:
    help: "转发给 oxlint（从 node_modules/.bin 或 PATH 查找；参数原样透传）"
    value: "参数"
  fmt:
    help: "转发给 oxfmt（从 node_modules/.bin 或 PATH 查找；参数原样透传）"
    value: "参数"
  serve:
    help: "通过 HTTP 提供目录或 JS 处理器服务（H1/H2/H3；TLS 经 --cert/--key 或 ACME）"
    value: "目录"
  db:
    help: "查看 turso/SQLite 数据库文件（默认列出全部表，或执行 --exec SQL）"
    value: "文件"
  args:
    help: "传给 --run 的脚本参数（即 `process.argv.slice(2)`）"
    value: "参数"
  dry_run:
    help: "只求解/校验并打印，不写任何文件（add/install/remove/uninstall/publish/init/upgrade、--serve 的 ACME、--db 的计划打印）"
  registry:
    help: "Registry 基地址（仅软件包动作 add/install/publish/login/init；默认 https://registry.npmjs.org）"
    value: "注册表地址"
  tag:
    help: "发布时使用的 dist-tag（仅 publish）"
    value: "标签"
  token:
    help: "要保存的认证令牌（仅 login；TTY 下缺省会提示输入）"
    value: "令牌"
  oauth:
    help: "改为打印 OAuth 授权 URL（仅 login；code 交换顺延）"
  name:
    help: "--init 用的软件包名（默认取当前目录名）"
    value: "名称"
  yes:
    help: "跳过确认提示（仅 init）"
  force:
    help: "覆盖冲突文件而非报错（仅 init）"
  filter:
    help: "只运行匹配该 glob 的文件（仅 test；按相对路径或文件名匹配）"
    value: "过滤条件"
  test_name_pattern:
    help: "只运行全名命中的测试（仅 test；子串或 /正则/flags）"
    value: "匹配串"
  watch:
    help: "文件变化时重跑/重载（仅 test/run/serve；Ctrl-C 停止）"
  dir:
    help: "要提供服务的目录（仅 serve）"
    value: "目录"
  host:
    help: "绑定的网卡地址（仅 serve）"
    value: "主机"
  port:
    help: "绑定的端口（仅 serve；0 表示临时端口，实际端口打印到标准输出）"
    value: "端口"
  handler:
    help: "--serve 用的 JS 处理文件（export default { fetch } 或 export function fetch）"
    value: "文件"
  limit_rps:
    help: "每秒请求数限制（仅 serve；0 表示不限）"
    value: "限流值"
  cert:
    help: "TLS 证书（仅 serve；PEM，必须与 --key 同给）"
    value: "证书"
  key:
    help: "TLS 私钥（仅 serve；PEM，必须与 --cert 同给）"
    value: "密钥"
  acme_domain:
    help: "ACME 自动证书域名（仅 serve；默认 winterjs.bemly.moe；需配 --acme-email）"
    value: "域名"
  acme_email:
    help: "ACME 账户邮箱（仅 serve；Let's Encrypt 的 mailto 联系人）"
    value: "邮箱"
  acme_cache:
    help: "ACME 缓存目录（仅 serve；默认系统缓存）"
    value: "目录"
  acme_production:
    help: "用 Let's Encrypt 生产环境（仅 serve；默认 staging，防限流误触）"
  schema:
    help: "改为打印配置文件的 JSON Schema（仅 config）"
  exec:
    help: "对数据库执行的 SQL（仅 db；默认列出全部表）"
    value: "SQL"
  storage_path:
    help: "全局 storage/localStorage 的数据库文件（仅 run/eval/test/repl/serve；默认 ./winterjs-storage.db）"
    value: "文件"
  allow_read:
    help: "允许文件系统读取（仅 run/eval/test/repl/db；可选：--allow-read=<路径>[,<路径>...]）"
    value: "路径"
  allow_write:
    help: "允许文件系统写入（仅 run/eval/test/repl/db；可选：--allow-write=<路径>[,<路径>...]）"
    value: "路径"
  allow_env:
    help: "允许访问环境变量（仅 run/eval/test/repl/db；可选：--allow-env=<变量名>[,<变量名>...]）"
    value: "变量名"
  allow_run:
    help: "允许派生子进程（仅 run/eval/test/repl/db；可选：--allow-run=<命令>[,<命令>...]）"
    value: "命令"
  allow_ffi:
    help: "允许 FFI（仅 run/eval/test/repl/db；dlopen 本地库）"
  allow_all:
    help: "允许一切（仅 run/eval/test/repl/db；关闭沙箱）"
  help:
    help: "打印帮助信息"
  version:
    help: "打印版本信息"
